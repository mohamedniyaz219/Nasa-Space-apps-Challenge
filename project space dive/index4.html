<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System with Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; }
        .label {
            position: absolute;
            color: white;
            font-size: 12px;
            padding: 2px;
        }
        .asteroid-label {
            color: rgba(255, 255, 255, 0.5); /* Dims the label by reducing opacity */
        }
        #toggle-asteroids {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            padding: 5px 10px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="toggle-asteroids">Toggle Asteroids</button>
    <div id="canvas-container"></div>

    <!-- Add Three.js and OrbitControls from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Initialize the scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Create a camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        // Create a renderer and add it to the DOM
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Add orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Add a point light to simulate the Sun
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(0, 0, 0); // Sun at the center
        scene.add(pointLight);

        // Function to add a Sun to the scene
        function addSun() {
            const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Sun color (yellow)
            const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
            scene.add(sunMesh);
        }
        addSun();

        // Increase planet speeds by 1.5x and make inner planets move faster than outer ones
        const baseSpeed = 0.00015;
        const planetSpeeds = {
            mercury: baseSpeed * 1.5,
            venus: baseSpeed * 1.2,
            earth: baseSpeed * 1,
            mars: baseSpeed * 0.8,
            jupiter: baseSpeed * 0.5,
            saturn: baseSpeed * 0.4,
            uranus: baseSpeed * 0.3,
            neptune: baseSpeed * 0.2,
            pluto: baseSpeed * 0.1
        };

        // Function to add a planet to the scene
        function addPlanet(name, radius, color, distanceFromSun) {
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: color });
            const planet = new THREE.Mesh(geometry, material);
            planet.position.x = distanceFromSun;
            scene.add(planet);

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = name;
            document.body.appendChild(label);

            planet.userData.label = label; // Attach label to planet
            return planet;
        }

        // Function to create orbital lines for planets
        function addOrbitalLine(distanceFromSun, color) {
            const points = [];
            const segments = 100;
            const radius = distanceFromSun;

            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const x = radius * Math.cos(angle);
                const z = radius * Math.sin(angle);
                points.push(new THREE.Vector3(x, 0, z));
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, opacity: 0.5, transparent: true });
            const orbitLine = new THREE.LineLoop(geometry, material);
            scene.add(orbitLine);
        }

        // Add planets and orbital lines
        addOrbitalLine(6, 0xaaaaaa);  const mercury = addPlanet('Mercury', 0.4, 0xaaaaaa, 6);  
        addOrbitalLine(9, 0xffcc00);  const venus = addPlanet('Venus', 0.95, 0xffcc00, 9);     
        addOrbitalLine(12, 0x0000ff); const earth = addPlanet('Earth', 1, 0x0000ff, 12);       
        addOrbitalLine(15, 0xff0000); const mars = addPlanet('Mars', 0.53, 0xff0000, 15);      
        addOrbitalLine(20, 0xffa500); const jupiter = addPlanet('Jupiter', 1.12, 0xffa500, 20); 
        addOrbitalLine(25, 0xffd700); const saturn = addPlanet('Saturn', 0.945, 0xffd700, 25); 
        addOrbitalLine(30, 0x00ffff); const uranus = addPlanet('Uranus', 0.4, 0x00ffff, 30);   
        addOrbitalLine(35, 0x0000ff); const neptune = addPlanet('Neptune', 0.388, 0x0000ff, 35); 
        addOrbitalLine(40, 0xffffff); const pluto = addPlanet('Pluto', 0.018, 0xffffff, 40);

        let asteroidMeshes = []; // Store asteroid meshes
        // Fetch asteroids from NASA API
        async function fetchAsteroids() {
            const apiKey = 'QAbotNKBlenUTnAh1WhdeyVP81vfnPu3zHoXRPdE'; // Replace with your NASA API key
            try {
                const response = await fetch(`https://api.nasa.gov/neo/rest/v1/feed?start_date=2024-01-01&end_date=2024-01-07&api_key=${apiKey}`);
                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                const data = await response.json();
                return data.near_earth_objects;
            } catch (error) {
                console.error('Error fetching asteroids:', error);
                return [];
            }
        }

        // Add asteroids to the scene
        async function addAsteroidsToScene() {
            const asteroids = await fetchAsteroids();
            Object.keys(asteroids).forEach(date => {
                asteroids[date].forEach(asteroid => {
                    const geometry = new THREE.SphereGeometry(0.5, 32, 32);
                    const material = new THREE.MeshBasicMaterial({ color: 0x808080 });
                    const asteroidMesh = new THREE.Mesh(geometry, material);

                    asteroidMesh.position.set(
                        (Math.random() - 0.5) * 100,
                        (Math.random() - 0.5) * 100,
                        (Math.random() - 0.5) * 100
                    );
                    scene.add(asteroidMesh);
                    asteroidMeshes.push(asteroidMesh); // Store the asteroid mesh

                    const label = document.createElement('div');
                    label.className = 'label asteroid-label'; // Apply the dimmed style to asteroid labels
                    label.textContent = asteroid.name;
                    document.body.appendChild(label);

                    asteroidMesh.userData.label = label;
                });
            });
        }
        addAsteroidsToScene();

        // Function to update the labels' positions
        function updateLabels() {
            scene.traverse(function (object) {
                if (object instanceof THREE.Mesh && object.userData.label) {
                    const label = object.userData.label;
                    const vector = new THREE.Vector3(object.position.x, object.position.y, object.position.z);
                    vector.project(camera);

                    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;

                    label.style.left = `${x}px`;
                    label.style.top = `${y}px`;
                }
            });
        }

        // Toggle asteroids visibility
        let asteroidsVisible = true;
        document.getElementById('toggle-asteroids').addEventListener('click', () => {
            asteroidsVisible = !asteroidsVisible;
            asteroidMeshes.forEach(mesh => {
                mesh.visible = asteroidsVisible; // Toggle visibility
                if (mesh.userData.label) {
                    mesh.userData.label.style.display = asteroidsVisible ? 'block' : 'none'; // Toggle label visibility
                }
            });
        });

        // Animate the scene and update planet positions
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const time = performance.now();

            // Update planets' positions based on their respective speeds
            mercury.position.x = 6 * Math.cos(planetSpeeds.mercury * time);
            mercury.position.z = 6 * Math.sin(planetSpeeds.mercury * time);

            venus.position.x = 9 * Math.cos(planetSpeeds.venus * time);
            venus.position.z = 9 * Math.sin(planetSpeeds.venus * time);

            earth.position.x = 12 * Math.cos(planetSpeeds.earth * time);
            earth.position.z = 12 * Math.sin(planetSpeeds.earth * time);

            mars.position.x = 15 * Math.cos(planetSpeeds.mars * time);
            mars.position.z = 15 * Math.sin(planetSpeeds.mars * time);

            jupiter.position.x = 20 * Math.cos(planetSpeeds.jupiter * time);
            jupiter.position.z = 20 * Math.sin(planetSpeeds.jupiter * time);

            saturn.position.x = 25 * Math.cos(planetSpeeds.saturn * time);
            saturn.position.z = 25 * Math.sin(planetSpeeds.saturn * time);

            uranus.position.x = 30 * Math.cos(planetSpeeds.uranus * time);
            uranus.position.z = 30 * Math.sin(planetSpeeds.uranus * time);

            neptune.position.x = 35 * Math.cos(planetSpeeds.neptune * time);
            neptune.position.z = 35 * Math.sin(planetSpeeds.neptune * time);

            pluto.position.x = 40 * Math.cos(planetSpeeds.pluto * time);
            pluto.position.z = 40 * Math.sin(planetSpeeds.pluto * time);

            updateLabels();
            renderer.render(scene, camera);
        }
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
